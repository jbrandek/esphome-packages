substitutions:
  device_name: diras-switch-3-t1
  friendly_name: "DiraSmart Switch 3 T1"
  light_name_1: "Luz 1"
  light_name_2: "Luz 2"
  light_name_3: "Luz 3"

esphome:
  name: ${device_name}
  on_boot:
    then:
      - light.control:
          id: my_light_1
          state: !lambda return id(last_light1_state);
      - light.control:
          id: green_led_1
          state: !lambda return id(last_light1_state);
      - light.control:
          id: my_light_2
          state: !lambda return id(last_light2_state);
      - light.control:
          id: green_led_2
          state: !lambda return id(last_light2_state);
      - light.control:
          id: my_light_3
          state: !lambda return id(last_light3_state);
      - light.control:
          id: green_led_3
          state: !lambda return id(last_light3_state);
  project:
    name: DiraSmart.Switch-3-T1-3S
    version: "T1-3S"

bk72xx:
  board: t1-3s

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot (captive portal) if the WiFi connection fails
  ap:
    ssid: "${friendly_name} AP"
    password: "1234567890"

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

globals:
  - id: last_light1_state
    type: boolean
    restore_value: yes
    initial_value: 'false'
  - id: last_light2_state
    type: boolean
    restore_value: yes
    initial_value: 'false'
  - id: last_light3_state
    type: boolean
    restore_value: yes
    initial_value: 'false'

preferences:
  flash_write_interval: 30s

# ---------------------------------------------------------------
# PINES: copiados del CB3S. VERIFICAR contra el esquema del T1-3S
# (t1-3s.svg en docs.libretiny.eu) antes de energizar.
# ---------------------------------------------------------------
output:
  - platform: gpio
    pin:
      number: P6
    id: switch_output_1

  - platform: gpio
    pin:
      number: P11      # Ojo: P10/P11 son UART1 (RX1/TX1) usado para flashear
    inverted: true
    id: green_led_output_1

  - platform: gpio
    pin:
      number: P9
    id: switch_output_2

  - platform: gpio
    pin:
      number: P26
    inverted: true
    id: green_led_output_2

  - platform: gpio
    pin:
      number: P8
    id: switch_output_3

  - platform: gpio
    pin:
      number: P14
    inverted: true
    id: green_led_output_3

  - platform: gpio
    pin:
      number: P20
    inverted: true
    id: wifi_led_output

light:
  - platform: binary
    name: ${friendly_name} WiFi LED
    restore_mode: RESTORE_DEFAULT_ON
    id: wifi_led
    disabled_by_default: true
    output: wifi_led_output

  - platform: binary
    restore_mode: RESTORE_DEFAULT_OFF
    name: ${light_name_1}
    id: my_light_1
    output: switch_output_1
    on_turn_on:
      - light.turn_on: green_led_1
      - globals.set:
          id: last_light1_state
          value: 'true'
    on_turn_off:
      - light.turn_off: green_led_1
      - globals.set:
          id: last_light1_state
          value: 'false'

  - platform: binary
    restore_mode: RESTORE_DEFAULT_OFF
    id: green_led_1
    output: green_led_output_1

  - platform: binary
    restore_mode: RESTORE_DEFAULT_OFF
    name: ${light_name_2}
    id: my_light_2
    output: switch_output_2
    on_turn_on:
      - light.turn_on: green_led_2
      - globals.set:
          id: last_light2_state
          value: 'true'
    on_turn_off:
      - light.turn_off: green_led_2
      - globals.set:
          id: last_light2_state
          value: 'false'

  - platform: binary
    restore_mode: RESTORE_DEFAULT_OFF
    id: green_led_2
    output: green_led_output_2

  - platform: binary
    restore_mode: RESTORE_DEFAULT_OFF
    name: ${light_name_3}
    id: my_light_3
    output: switch_output_3
    on_turn_on:
      - light.turn_on: green_led_3
      - globals.set:
          id: last_light3_state
          value: 'true'
    on_turn_off:
      - light.turn_off: green_led_3
      - globals.set:
          id: last_light3_state
          value: 'false'

  - platform: binary
    restore_mode: RESTORE_DEFAULT_OFF
    id: green_led_3
    output: green_led_output_3

  - platform: status_led
    id: blue_led
    pin:
      number: P23
      inverted: true

binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: P24
      inverted: true
      mode: INPUT_PULLUP
    name: ${device_name}_button_1
    id: relay_button_1
    on_multi_click:
      - timing:
          - ON for 40ms to 800ms
          - OFF for at least 400ms
        then:
          - light.toggle: my_light_1
      - timing:
          # 5 clics = reinicio
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for at least 400ms
        then:
          - button.press:
              id: restart_button

  - platform: gpio
    internal: true
    pin:
      number: P7
      mode: INPUT_PULLUP
      inverted: true
    name: ${device_name}_button_2
    id: relay_button_2
    on_multi_click:
      - timing:
          - ON for 40ms to 800ms
          - OFF for at least 400ms
        then:
          - light.toggle: my_light_2
      - timing:
          # 5 clics = reinicio
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for at least 400ms
        then:
          - button.press:
              id: restart_button

  - platform: gpio
    internal: true
    pin:
      number: P10      # Ojo: RX1 (UART de flasheo)
      mode: INPUT_PULLUP
      inverted: true
    name: ${device_name}_button_3
    id: relay_button_3
    on_multi_click:
      - timing:
          - ON for 40ms to 800ms
          - OFF for at least 400ms
        then:
          - light.toggle: my_light_3
      - timing:
          # 5 clics = reinicio
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 400ms
          - OFF for at least 400ms
        then:
          - button.press:
              id: restart_button

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"
    mac_address:
      name: "MAC Address"

sensor:
  - platform: wifi_signal
    name: "WiFi Strength"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

button:
  - platform: restart
    id: restart_button
    name: "Reboot"
    entity_category: config

switch:
  - platform: safe_mode
    name: "Safe Mode"
    id: device_safe_mode
    entity_category: config
